<div class="comments">
    <div id="giscus-container"></div>
    <script>
        (() => {
            const container = document.getElementById("giscus-container");
            if (!container) return;

            const getTheme = () => {
                const preference = localStorage.getItem("pref-theme");
                if (preference === "dark" || preference === "light") {
                    return preference;
                }

                const pageTheme = document.documentElement.dataset.theme;
                if (pageTheme === "dark" || pageTheme === "light") {
                    return pageTheme;
                }

                return window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";
            };

            const attributes = {
                src: "https://giscus.app/client.js",
                "data-repo": "frankchang0125/blog",
                "data-repo-id": "R_kgDOUrkXXg",
                "data-category": "Announcements",
                "data-category-id": "DIC_kwDOUrkXXs4DGarm",
                "data-mapping": "url",
                "data-strict": "0",
                "data-reactions-enabled": "1",
                "data-emit-metadata": "0",
                "data-input-position": "bottom",
                "data-theme": getTheme(),
                "data-lang": "zh-TW",
                "data-loading": "lazy",
                crossorigin: "anonymous",
                async: ""
            };

            const giscusScript = document.createElement("script");
            Object.entries(attributes).forEach(([name, value]) => {
                giscusScript.setAttribute(name, value);
            });
            container.appendChild(giscusScript);

            const updateGiscusTheme = () => {
                const iframe = container.querySelector("iframe.giscus-frame");
                if (!iframe || !iframe.contentWindow) return;

                iframe.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: getTheme() } } },
                    "https://giscus.app"
                );
            };

            const iframeObserver = new MutationObserver(updateGiscusTheme);
            iframeObserver.observe(container, { childList: true, subtree: true });

            const themeObserver = new MutationObserver(updateGiscusTheme);
            themeObserver.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ["data-theme"]
            });

            window.addEventListener("storage", (event) => {
                if (event.key === "pref-theme") updateGiscusTheme();
            });

            const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
            colorScheme.addEventListener?.("change", updateGiscusTheme);
        })();
    </script>
</div>
