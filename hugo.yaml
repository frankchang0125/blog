baseURL: https://0xc0de.xyz/
languageCode: zh-tw
defaultContentLanguage: zh-tw
title: "0xc0de"
theme: PaperMod
pagination:
  pagerSize: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

minify:
  disableXML: true
  minifyOutput: true

services:
  googleAnalytics:
    id: "G-NE2WYBYMXJ"

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: "tags"
      weight: 100
    - name: "date"
      weight: 10

taxonomies:
  series: series
  category: categories
  tag: tags

params:
  env: production
  title: "0xc0de"
  description: "0xc0de - Built by Hugo and PaperMod"
  keywords: [Linux, Kernel, Linux Kernel, QEMU, RISC-V, Computer Architecture]
  author: "Frank Chang"
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "2006/01/02"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    favicon: /favicon.ico

  label:
    text: "0xc0de"
    iconHeight: 35

  homeInfoParams:
    Title: "Hello World!"
    Content: Linux Kernel, QEMU, RISC-V, and Computer Architecture

  socialIcons:
    - name: github
      url: "https://github.com/frankchang0125"
    - name: linkedin
      url: "https://www.linkedin.com/in/frankchang0125"
    - name: email
      url: "mailto:frankchang0125@gmail.com"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: archives
      name: "全部文章"
      url: /archives/
      weight: 10
    - identifier: series
      name: "系列文"
      url: /series/
      weight: 20
    - identifier: categories
      name: "文章分類"
      url: /categories/
      weight: 30
    - identifier: tags
      name: "標籤"
      url: /tags/
      weight: 40
    - identifier: search
      name: "搜尋"
      url: /search/
      weight: 50
    - identifier: rss
      name: "RSS"
      url: index.xml
      weight: 60

markup:
  highlight:
    style: monokai
    noClasses: true
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
